<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Toivo Member Journey</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: step list | phone | explainer. Single dark Toivo look (indigo, violet primary) matching the Toivo wireframes. */
:root{
  color-scheme: dark;
  --bg:#0E0B26; --surface:#1E1948; --surface-2:#28225C; --raise:#322B6E; --line:#352E70; --line-2:#463D8C;
  --text:#F2F0FF; --muted:#B7B1DD; --faint:#8A83BB;
  --brand:#7B61FF; --brand-2:#A592FF; --ok:#3DDC97; --warn:#FFB454; --bad:#FF6B81; --gold:#FBC21B; --teal:#22D8B3;
  --font: Aptos, "Figtree", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(900px 520px at 75% -12%, #2B1F7A 0%, rgba(14,11,38,0) 62%);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.top{max-width:1300px;margin:0 auto;padding:18px 20px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .gc{font-weight:800;font-size:16px}
.top .gc b{color:var(--gold)}
.top .role{font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-2);border-radius:99px;padding:3px 9px;color:var(--muted)}
.top .demo{margin-left:auto;font-size:12px;color:var(--faint)}
.layout{display:grid;grid-template-columns:230px 400px minmax(0,1fr);gap:28px;max-width:1300px;margin:0 auto;padding:20px 20px 40px;align-items:start}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px;position:sticky;top:16px}
.steps button{width:100%;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:10px;color:var(--muted);font-weight:600}
.steps button:hover{background:var(--surface)}
.steps .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:11.5px;font-weight:700}
.steps button[aria-current="true"]{background:var(--surface-2);color:var(--text)}
.steps button[aria-current="true"] .n{background:var(--brand);border-color:var(--brand);color:#fff}
.steps button.done .n{background:rgba(61,220,151,.15);border-color:var(--ok);color:var(--ok)}
.steps .d{display:block;font-size:11px;color:var(--faint);font-weight:500}
.phone{width:100%;max-width:390px;height:800px;border-radius:46px;background:#05040F;padding:11px;border:1px solid var(--line-2);box-shadow:0 30px 80px rgba(0,0,0,.5);margin:0 auto;position:sticky;top:16px}
.screen{height:100%;border-radius:36px;overflow:hidden;background:linear-gradient(180deg,#1A1545 0%,#110D2E 100%);display:flex;flex-direction:column;position:relative}
.sbar{display:flex;justify-content:space-between;padding:13px 26px 4px;font-size:12px;font-weight:700;flex:none}
.pscroll{flex:1;overflow-y:auto;padding:8px 18px 22px;display:flex;flex-direction:column;gap:14px}
.pnav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:#16123B;padding:8px 6px 16px}
.pnav button{border:0;background:transparent;color:var(--faint);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px}
.pnav button[aria-current="true"]{color:var(--brand-2)}
.pnav svg{width:20px;height:20px}
.toivo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:18px;letter-spacing:.01em}
.toivo svg{width:24px;height:24px}
.ph-h{font-size:23px;font-weight:800;letter-spacing:-.01em}
.ph-p{color:var(--muted);font-size:13.5px}
.center{text-align:center}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:700}
.btn{border:1px solid var(--line-2);background:var(--surface-2);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px}
.btn:hover{background:var(--raise)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#6A4FF5}
.btn.block{width:100%;padding:14px;border-radius:14px;font-size:14.5px}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12px}
.back{align-self:flex-start;border:0;background:transparent;color:var(--muted);padding:0;font-weight:600}
.ill{display:grid;place-items:center;padding:6px 0}
.ill svg{width:190px;height:150px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:6px;height:6px;border-radius:99px;background:var(--line-2)}
.dots i.on{width:18px;background:var(--brand)}
.field{display:grid;gap:5px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input{background:#15113A;border:1px solid var(--line-2);border-radius:12px;padding:11px 12px;color:var(--text);font:inherit;width:100%}
.consent{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.consent:first-of-type{border-top:0}
.consent .bx{width:22px;height:22px;border-radius:7px;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;font-size:12px;margin-top:1px}
.consent[aria-checked="true"] .bx{background:var(--brand);border-color:var(--brand);color:#fff}
.consent b{display:block;font-size:13.5px}
.consent span.s{font-size:12.5px;color:var(--muted)}
.ws{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ws:first-child{border-top:0}
.ws .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#120E33;font-size:15px}
.ws b{display:block}
.ws span{font-size:12.5px;color:var(--muted)}
.acct{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.acct i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-weight:800;color:#0E0B26;flex:none}
.acct b{display:block;font-size:13.5px}
.acct span{font-size:12px;color:var(--muted)}
.acct .r{margin-left:auto}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid var(--line-2);border-top-color:var(--brand-2);animation:spin .9s linear infinite;margin:40px auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat2 .pcard .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.stat2 .pcard .m{font-size:11.5px;color:var(--muted)}
.op{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.op:first-child{border-top:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.p-ok{background:rgba(61,220,151,.14);color:var(--ok);border-color:rgba(61,220,151,.3)}
.p-warn{background:rgba(255,180,84,.14);color:var(--warn);border-color:rgba(255,180,84,.3)}
.p-bad{background:rgba(255,107,129,.14);color:var(--bad);border-color:rgba(255,107,129,.3)}
.p-brand{background:rgba(123,97,255,.18);color:var(--brand-2);border-color:rgba(123,97,255,.4)}
.p-muted{background:var(--surface-2);color:var(--muted);border-color:var(--line-2)}
.agent{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.agent:first-child{border-top:0}
.agent .st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;border:2px solid var(--line-2)}
.agent.done .st{background:var(--ok);border-color:var(--ok);color:#06261A}
.agent.run .st{border-color:var(--brand-2);border-top-color:transparent;animation:spin .8s linear infinite}
.agent.flag .st{background:var(--warn);border-color:var(--warn);color:#2B1A00}
.agent b{display:block;font-size:13px}
.agent span{font-size:11.5px;color:var(--muted)}
.tcard{border-radius:18px;padding:18px;background:linear-gradient(135deg,#7B61FF 0%,#4B33C9 55%,#2A1E86 100%);box-shadow:0 14px 30px rgba(75,51,201,.35);display:grid;gap:22px;aspect-ratio:1.6/1;max-width:100%}
.tcard .row{display:flex;justify-content:space-between;align-items:flex-start}
.tcard .nm{font-weight:700;font-size:15px}
.tcard .no{font-size:15px;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.tcard small{font-size:11px;opacity:.8}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.ctl:first-of-type{border-top:0}
.sw{width:40px;height:23px;border-radius:99px;background:var(--line-2);position:relative;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--brand)}
.sw.on::after{left:20px}
.sw.lock{background:var(--bad)}
.sw.lock::after{left:20px}
.bar{height:7px;border-radius:99px;background:#15113A;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand-2)}
.wrow{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .h{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.wrow .h b{font-weight:700}
.wrow .h span{color:var(--muted);font-variant-numeric:tabular-nums}
.task{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.task .bx{width:22px;height:22px;border-radius:7px;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;font-size:12px}
.task.done .bx{background:var(--ok);border-color:var(--ok);color:#06261A}
.task b{display:block;font-size:13.5px}
.task span{font-size:12px;color:var(--muted)}
.task .go{margin-left:auto;color:var(--faint);font-size:18px}
.tx{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.tx:first-child{border-top:0}
.tx i{width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;flex:none}
.tx .a{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.ring{display:grid;place-items:center;position:relative}
.ring svg{width:132px;height:132px}
.ring .in{position:absolute;text-align:center}
.ring .in b{font-size:30px;font-weight:800;display:block;line-height:1}
.ring .in span{font-size:11px;color:var(--muted)}
.gstage{height:220px;border-radius:18px;background:#120E33;border:1px solid var(--line-2);display:grid;place-items:center;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer;transition:background .12s}
.gstage svg{width:116px;height:116px}
.gstage.hit{background:rgba(61,220,151,.16)}
.gstage.err{background:rgba(255,107,129,.2)}
.gprog{height:6px;border-radius:99px;background:#120E33;overflow:hidden}
.gprog i{display:block;height:100%;background:var(--brand-2);transition:width .2s}
.legend{display:flex;gap:14px;justify-content:center}
.legend svg{width:38px;height:38px}
.opt{display:grid;gap:4px;text-align:left;padding:14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);width:100%}
.opt[aria-pressed="true"]{border-color:var(--brand);background:rgba(123,97,255,.12)}
.opt b{font-size:14.5px}
.opt span{font-size:12.5px;color:var(--muted)}
.crit{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.crit:first-child{border-top:0}
.crit i{width:20px;height:20px;border-radius:50%;background:var(--ok);color:#06261A;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800}
.crit span{color:var(--muted);display:block;font-size:12px}
.notes{position:sticky;top:16px;display:grid;gap:16px}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.ncard .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--brand-2)}
.ncard h2{font-size:24px;margin-top:6px;letter-spacing:-.01em}
.ncard p{color:var(--muted);margin-top:10px;max-width:60ch}
.ncard ul{margin:14px 0 0;padding-left:18px;color:var(--text);display:grid;gap:6px;max-width:60ch}
.ncard ul li::marker{color:var(--brand-2)}
.sees{display:grid;gap:0;margin-top:16px}
.sees div{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.sees div span:first-child{color:var(--faint);font-weight:600}
.navrow{display:flex;gap:10px;justify-content:space-between;align-items:center}
.navrow .pos{color:var(--faint);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raise);border:1px solid var(--line-2);padding:10px 16px;border-radius:12px;z-index:60;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100vw - 32px)}
footer{max-width:1300px;margin:0 auto;padding:0 20px 30px;color:var(--faint);font-size:12px}
@media (max-width:1180px){
  .layout{grid-template-columns:400px minmax(0,1fr)}
  .steps{grid-column:1/-1;position:static;display:flex;overflow-x:auto;gap:4px;padding-bottom:4px}
  .steps li{flex:none}
  .steps button{white-space:nowrap}
  .steps .d{display:none}
}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .phone,.notes{position:static}
}
@media (max-width:460px){
  .layout{padding-inline:16px}
  .phone{border-radius:0;padding:0;border:0;box-shadow:none;height:760px}
  .screen{border-radius:20px;border:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  return `<button class="back" data-act="tab:home">← Today</button><div class="lbl">Lesson 5 of 12 · 6 min</div><div class="ph-h">Chasing losses</div>
  <div class="pcard ph-p" style="color:var(--text);display:grid;gap:10px"><p>After a loss, the brain treats getting the money back as urgent. That feeling isn’t a plan. It’s a signal.</p><p>Chasing usually turns one loss into several. The money is already gone; the next bet doesn’t change that.</p><p><b>Try this:</b> when the urge to win it back shows up, name it (“this is chasing”), wait 20 minutes and message Laura or open your urge surfing audio.</p></div>
  <div class="pcard" style="display:grid;gap:8px"><b>Quick check: after a loss, the urge to win it back is…</b>
   ${[['a','A sign my luck is about to turn'],['b','A normal feeling that passes if I wait'],['c','A good reason to bet a bit more']].map(([k,t])=>`<button class="opt" style="padding:10px 12px" aria-pressed="${q===k}" data-act="quiz:${k}"><span style="color:var(--text);font-size:13px">${t}</span></button>`).join('')}
   ${q?`<p class="ph-p" style="font-size:12.5px;color:${q==='b'?'var(--ok)':'var(--warn)'}">${q==='b'?'Right. Urges peak and pass. Waiting is a skill you’re building.':'Not quite. The urge feels like a signal to act, but it passes if you wait.'}</p>`:''}
  </div>
  <button class="btn primary block" data-act="lessondone" ${q?'':'disabled'}>Complete lesson</button>`;
}

  return `<div class="ph-h">Toivo card</div><div class="stat2"><div class="pcard"><div class="m">Balance</div><div class="v">£182.40</div></div><div class="pcard"><div class="m">Left this month</div><div class="v">£214</div></div></div>
  <div class="pcard"><div class="lbl" style="margin-bottom:4px">Controls set by Laura</div><div class="ctl"><span>Monthly limit</span><b>£400</b></div><div class="ctl"><span>Gambling</span>${pill('p-bad','Always blocked')}</div><div class="ctl"><span>Cash withdrawals</span>${pill('p-muted','Off')}</div><div class="ctl"><span>Crypto</span>${pill('p-muted','Off')}</div><div class="ctl"><span>Card freeze</span><span style="display:flex;gap:8px;align-items:center"><span class="ph-p" style="font-size:12px">Laura can freeze</span>${pill('p-ok','Active')}</span></div></div>
  <div class="pcard"><div class="lbl" style="margin-bottom:4px">Blocked attempts</div><div class="tx"><i style="background:rgba(255,107,129,.2);color:var(--bad)">R</i><div><b>Royal Reels</b><div class="ph-p" style="font-size:11.5px">Sat 23:41 · Laura and Dr Okafor notified</div></div><span class="a" style="color:var(--bad)">£50.00</span></div></div>`;
}

/* ---------- game ---------- */
let G=null;
function gameScreen(){
  if(G) return `<div class="ph-h" style="font-size:18px">Tap shapes. Hold back on cues.</div><div class="gprog"><i id="gprog" style="width:0%"></i></div><div class="gstage" id="gstage" role="button" tabindex="0" aria-label="Tap area"></div><p class="ph-p center">Tap the box, or press Space</p><button class="btn ghost" data-act="gamestop">Stop</button>`;
  const r=S.gameRes;
  if(r) return `<button class="back" data-act="tab:home">← Today</button><div class="ph-h">Nice work</div>
   <div class="stat2"><div class="pcard"><div class="m">Accuracy</div><div class="v">${Math.round(r.acc*100)}%</div></div><div class="pcard"><div class="m">Reaction time</div><div class="v">${r.rt?r.rt+' ms':'—'}</div></div><div class="pcard"><div class="m">Held back on cues</div><div class="v">${r.cr}/6</div></div><div class="pcard"><div class="m">Missed shapes</div><div class="v">${r.miss}</div></div></div>
   <p class="ph-p">Holding back when a gambling cue appears is the skill you’re training. Your scores go to Dr Okafor.</p>
   <button class="btn primary block" data-act="gamestart">Play again</button><button class="btn block" data-act="tab:home">Back to today</button>`;
  return `<button class="back" data-act="tab:home">← Today</button><div><div class="ph-h">Impulse control training</div><p class="ph-p" style="margin-top:4px">Tap as fast as you can when you see a shape. Don’t tap when you see a gambling cue.</p></div>
  <div class="pcard"><div class="lbl" style="margin-bottom:8px">Tap these</div><div class="legend">${STIM.circle}${STIM.square}${STIM.tri}</div><div class="lbl" style="margin:12px 0 8px">Hold back on these</div><div class="legend">${STIM.dice}${STIM.card}${STIM.slot}</div></div>
  <button class="btn primary block" data-act="gamestart">Start · 20 rounds</button>`;
}
function startGame(){
  const go=['circle','square','tri'],ng=['dice','card','slot'],t=[];
  for(let i=0;i<14;i++) t.push({k:go[i%3],go:true});
  for(let i=0;i<6;i++) t.push({k:ng[i%3],go:false});
  for(let i=t.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[t[i],t[j]]=[t[j],t[i]];}
  G={t,i:-1,res:[],timer:null,shown:0,resp:false,on:false};
  render(); G.timer=setTimeout(nextTrial,700);
}
const stage=()=>document.getElementById('gstage');
function nextTrial(){
  if(!G) return; G.i++;
  const p=document.getElementById('gprog'); if(p) p.style.width=(G.i/G.t.length*100)+'%';
  if(G.i>=G.t.length) return finishGame();
  const el=stage(); if(!el) return stopGame();
  el.className='gstage'; el.innerHTML=STIM[G.t[G.i].k]; G.shown=performance.now(); G.resp=false; G.on=true;
  G.timer=setTimeout(endTrial,850);
}
function endTrial(){
  if(!G) return; const tr=G.t[G.i];
  if(!G.resp) G.res.push(tr.go?{t:'miss'}:{t:'cr'});
  G.on=false; const el=stage(); if(el){el.innerHTML=''; setTimeout(()=>{ if(el) el.className='gstage'; },120);}
  G.timer=setTimeout(nextTrial,380);
}
function respond(){
  if(!G||!G.on||G.resp) return; G.resp=true; const tr=G.t[G.i], el=stage();
  if(tr.go){G.res.push({t:'hit',rt:performance.now()-G.shown}); if(el) el.className='gstage hit';}
  else {G.res.push({t:'fa'}); if(el) el.className='gstage err';}
}
function finishGame(){
  const r=G.res, hits=r.filter(x=>x.t==='hit'), cr=r.filter(x=>x.t==='cr').length;
  S.gameRes={acc:(hits.length+cr)/G.t.length, rt:hits.length?Math.round(hits.reduce((a,b)=>a+b.rt,0)/hits.length):0, cr, miss:r.filter(x=>x.t==='miss').length};
  G=null; render();
}
function stopGame(){ if(G){clearTimeout(G.timer); G=null;} }

/* ---------- render ---------- */
function phoneNav(){
  if(STEPS[S.step].id!=='progress') return '';
  const b=(k,l,ic)=>`<button data-act="tab:${k}" aria-current="${S.tab===k}">${ICON[ic]}${l}</button>`;
  return `<nav class="pnav">${b('home','Today','home')}${b('game','Train','train')}${b('learn','Learn','learn')}${b('card','Card','card')}</nav>`;
}
function render(){
  const st=STEPS[S.step], n=NOTES[st.id];
  const ps=document.getElementById('pscroll'), keep=ps?{k:render.k,t:ps.scrollTop}:null, key=st.id+S.sub+S.tab;
  const steps=STEPS.map((x,i)=>`<li><button data-act="go:${i}" aria-current="${i===S.step}" class="${i<S.step?'done':''}"><span class="n">${i<S.step?'✓':i+1}</span><span>${x.t}<span class="d">${x.d}</span></span></button></li>`).join('');
  document.getElementById('app').innerHTML=`
  <div class="top"><span class="gc">Gaim<b>Control</b></span><span class="role">Member view · Toivo app</span><span class="demo">Demo · fictional data</span></div>
  <div class="layout">
   <ol class="steps" aria-label="Journey steps">${steps}</ol>
   <div class="phone" aria-label="Daniel’s phone"><div class="screen"><div class="sbar"><span>${st.id==='email'?'09:41':'19:12'}</span><span>●●● 5G</span></div><div class="pscroll" id="pscroll">${SCREENS[st.id]()}</div>${phoneNav()}</div></div>
   <div class="notes"><div class="ncard"><span class="eyebrow">Step ${S.step+1} of ${STEPS.length} · ${st.d}</span><h2>${n.h}</h2><p>${n.p}</p><ul>${n.li.map(x=>`<li>${x}</li>`).join('')}</ul>
    <div class="sees"><span class="lbl" style="margin-bottom:4px">Who sees what</span><div><span>Lender</span><span>${n.see[0]}</span></div><div><span>Therapist</span><span>${n.see[1]}</span></div></div></div>
    <div class="navrow"><button class="btn" data-act="prev" ${S.step===0?'disabled':''}>← Back</button><span class="pos">Use the phone, or step through here</span><button class="btn primary" data-act="next" ${S.step===STEPS.length-1?'disabled':''}>Next step →</button></div></div>
  </div>
  <footer>Demo with fictional people, organisations and figures. Operator and bank names are invented. Completion criteria are a draft for discussion.</footer>
  ${S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:''}`;
  const np=document.getElementById('pscroll'); if(np && keep && keep.k===key) np.scrollTop=keep.t; else if(np) np.scrollTop=0;
  render.k=key;
}
let tt=null; function toast(t){S.toast=t;render();clearTimeout(tt);tt=setTimeout(()=>{S.toast=null;render();},2800);}
function goStep(i){ clearTimers(); S.step=Math.max(0,Math.min(STEPS.length-1,i)); S.sub=0; S.tab='home';
  if(STEPS[S.step].id==='exclusion') S.agentsDone=0;
  render(); window.scrollTo({top:0,behavior:'smooth'}); }
function act(a){
  const [k,x]=a.split(/:(.*)/s);
  switch(k){
   case 'next': return goStep(S.step+1);
   case 'prev': return goStep(S.step-1);
   case 'go': return goStep(+x);
   case 'restart': S.gameRes=null;S.lessonDone=false;S.quiz=null;S.choice='reapply'; return goStep(0);
   case 'sub': clearTimers(); S.sub=+x; break;
   case 'cons': S.consents[+x]=!S.consents[+x]; break;
   case 'dcons': S.dataConsents[+x]=!S.dataConsents[+x]; break;
   case 'auth': S.authorise=!S.authorise; break;
   case 'obconnect': S.sub=2; render(); later(()=>{S.sub=3;render();},1600); return;
   case 'agents': S.sub=1; S.agentsDone=0; render(); for(let i=1;i<=AGENTS.length;i++) later(()=>{S.agentsDone=i;render();},i*650); return;
   case 'tab': stopGame(); S.tab=x; break;
   case 'gamestart': S.gameRes=null; startGame(); return;
   case 'gamestop': stopGame(); break;
   case 'quiz': S.quiz=x; break;
   case 'lessondone': S.lessonDone=true; S.tab='home'; toast('Lesson complete. Dr Okafor can see your progress.'); return;
   case 'choice': S.choice=x; break;
   case 'toast': return toast(x);
  }
  render();
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]'); if(!t) return; act(t.dataset.act);});
document.addEventListener('pointerdown',e=>{ if(e.target.closest('#gstage')){ e.preventDefault(); respond(); } });
document.addEventListener('keydown',e=>{ if(G&&(e.code==='Space'||e.key===' ')){e.preventDefault();respond();} });
render();
})();
</script>

</body></html>
